name: octria
description: "Turns any task into a classroom with a roadmap shown as a node graph."
publish_to: 'none'
version: 0.7.1+19

environment:
  sdk: ^3.13.7

dependencies:
  app_badge_plus: ^1.4.0
  cloud_firestore: ^7.1.0
  cupertino_icons: ^2.0.0
  file_picker: ^13.3.2
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  image: ^4.12.0
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: false
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
